# Выкладка сервера в Apps Script при каждом изменении папки server/.
# Нужен секрет CLASPRC_JSON (вход clasp под ceo@artgame.world). SCRIPT_ID — ID проекта Apps Script (не секрет).
# Адрес /exec не меняется: обновляется существующее развёртывание DEPLOYMENT_ID.
name: Deploy server (Apps Script)
on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/deploy-server.yml']
  workflow_dispatch:
env:
  SCRIPT_ID: 1Za8R1u2xSybF9azfjXgevD6i_qV5_T-JKcOv9JAefhylwKVsBYYTHazD
  DEPLOYMENT_ID: AKfycby48ml1Cr5RaGaZdLtTmVM2TERMi53RGiVCdBIRsTItjgFxH2cXMsbdeaDNBdlNfSzA
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check setup
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::warning::Нет секрета CLASPRC_JSON — выкладка пропущена"; exit 0; fi
          echo "READY=1" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        if: env.READY == '1'
        with: { node-version: '20' }
      - name: Push and deploy
        if: env.READY == '1'
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          npm i -g @google/clasp@2.4.2
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          printf '{"scriptId":"%s","rootDir":"server"}' "$SCRIPT_ID" > .clasp.json
          clasp push -f
          clasp deployments
          clasp deploy -i "$DEPLOYMENT_ID" -d "github ${GITHUB_SHA::7}"
